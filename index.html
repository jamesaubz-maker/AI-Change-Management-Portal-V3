<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHS AI Change Management Portal (V7)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hpca: { blue: '#005EB8', teal: '#00A9CE', navy: '#003087', lightBlue: '#E8EDEE', slate: '#425563' },
                        status: { success: '#007F3B', warning: '#FFB81C', danger: '#DA291C', info: '#41B6E6' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .ai-gradient-text { background: linear-gradient(135deg, #00A9CE 0%, #005EB8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ai-gradient-bg { background: linear-gradient(135deg, #00A9CE 0%, #005EB8 100%); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Comprehensive Icon Library (Lucide equivalents)
        const Icons = {
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            MessageSquare: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            PieChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>,
            List: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Scale: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>,
            BookOpen: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            HelpCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Layers: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>,
            Award: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Github: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>,
            MonitorPlay: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="m10 7 5 3-5 3Z"/></svg>,
            BarChart2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
            ExternalLink: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
            Send: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        };

        const InfoPopup = ({ title, what, why }) => {
            const [isOpen, setIsOpen] = useState(false);
            const handleToggle = (e) => {
                e.stopPropagation();
                setIsOpen(!isOpen);
            };
            return (
                <div className="relative inline-flex items-center ml-2 align-middle">
                    <button onClick={handleToggle} className="text-hpca-teal hover:text-hpca-blue focus:outline-none transition-colors" title="Learn More: What & Why">
                        <Icons.HelpCircle className="w-4 h-4" />
                    </button>
                    {isOpen && (
                        <div className="absolute z-[100] w-72 md:w-80 p-5 mt-2 left-0 top-full bg-white border border-slate-200 shadow-xl rounded-xl text-sm font-normal text-left animate-fade-in-up">
                            <div className="flex justify-between items-start mb-3 border-b border-slate-100 pb-2">
                                <h4 className="font-bold text-hpca-navy flex items-center">
                                    <Icons.Brain className="w-4 h-4 mr-2 text-hpca-teal" />
                                    {title}
                                </h4>
                                <button onClick={handleToggle} className="text-slate-400 hover:text-hpca-navy bg-slate-50 hover:bg-slate-100 rounded p-1 transition-colors">
                                    <Icons.Close className="w-3 h-3" />
                                </button>
                            </div>
                            <div className="mb-3 bg-hpca-lightBlue/30 p-3 rounded-lg border border-slate-100">
                                <span className="font-bold text-hpca-blue block mb-1 text-[10px] uppercase tracking-wider">The What</span>
                                <p className="text-slate-600 text-xs leading-relaxed">{what}</p>
                            </div>
                            <div className="bg-hpca-lightBlue/30 p-3 rounded-lg border border-slate-100">
                                <span className="font-bold text-hpca-blue block mb-1 text-[10px] uppercase tracking-wider">The Why</span>
                                <p className="text-slate-600 text-xs leading-relaxed">{why}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const PhaseTracker = ({ activePhase, title, description, whatNext, toolkitRef }) => {
            const [showToolkit, setShowToolkit] = useState(false);
            const [showCommunity, setShowCommunity] = useState(false);

            return (
                <div className="bg-hpca-navy rounded-2xl p-6 md:p-8 text-white mb-6 shadow-md relative overflow-hidden shrink-0">
                    <div className="absolute top-0 right-0 -mr-10 -mt-10 text-white/5 pointer-events-none">
                        <Icons.Layers className="w-64 h-64" />
                    </div>
                    <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div className="flex-1">
                            <div className="flex items-center space-x-3 mb-2">
                                <span className="bg-hpca-teal text-white text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">Phase {activePhase}</span>
                                <h2 className="text-2xl font-bold">{title}</h2>
                            </div>
                            <p className="text-slate-300 text-sm leading-relaxed max-w-3xl mb-4">{description}</p>
                            <div className="flex items-start bg-white/10 p-3 rounded-lg border border-white/10 inline-block">
                                <span className="text-hpca-teal font-bold text-xs uppercase tracking-wider block mb-1">What's Next:</span>
                                <p className="text-slate-200 text-xs font-medium">{whatNext}</p>
                            </div>
                        </div>
                        <div className="flex flex-col space-y-3 shrink-0">
                            <button onClick={() => setShowToolkit(true)} className="bg-white/10 hover:bg-white/20 border border-white/20 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center shadow-sm">
                                <Icons.BookOpen className="w-4 h-4 mr-2 text-hpca-teal" /> NHS Toolkit Reference
                            </button>
                            <button onClick={() => setShowCommunity(true)} className="bg-hpca-teal hover:bg-teal-400 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center shadow-sm">
                                <Icons.Users className="w-4 h-4 mr-2" /> Ask HPCA Community
                            </button>
                        </div>
                    </div>

                    {showToolkit && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white text-hpca-navy rounded-2xl max-w-md w-full p-6 shadow-2xl relative animate-fade-in-up">
                                <button onClick={() => setShowToolkit(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.Close className="w-5 h-5"/></button>
                                <div className="w-12 h-12 bg-hpca-lightBlue text-hpca-blue rounded-xl flex items-center justify-center mb-4"><Icons.BookOpen className="w-6 h-6"/></div>
                                <h3 className="text-xl font-bold mb-2">Toolkit Integration (Simulation)</h3>
                                <p className="text-sm text-slate-600 mb-4 leading-relaxed">In the live environment, clicking this button would navigate you directly to <strong className="text-hpca-blue">{toolkitRef}</strong> of the NHS Change Management Toolkit, opening the relevant PDF section in a side-panel for immediate reference.</p>
                                <button onClick={() => setShowToolkit(false)} className="w-full bg-hpca-navy text-white py-3 rounded-xl font-bold hover:bg-hpca-blue transition-colors">Got it</button>
                            </div>
                        </div>
                    )}

                    {showCommunity && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white text-hpca-navy rounded-2xl max-w-md w-full p-6 shadow-2xl relative animate-fade-in-up">
                                <button onClick={() => setShowCommunity(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.Close className="w-5 h-5"/></button>
                                <div className="w-12 h-12 bg-hpca-teal/20 text-hpca-teal rounded-xl flex items-center justify-center mb-4"><Icons.MessageSquare className="w-6 h-6"/></div>
                                <h3 className="text-xl font-bold mb-2">Ask the Community (Simulation)</h3>
                                <p className="text-sm text-slate-600 mb-4 leading-relaxed">In the live environment, you could post a question here to instantly reach the 4,000+ members of the Health and Care Professionals Council. The AI would automatically tag relevant experts based on your current project phase.</p>
                                <div className="bg-slate-50 border border-slate-200 p-3 rounded-lg mb-4 text-sm text-slate-400 italic">"I'm struggling with stakeholder resistance in my EPR rollout. Has anyone encountered..."</div>
                                <button onClick={() => setShowCommunity(false)} className="w-full bg-hpca-teal text-white py-3 rounded-xl font-bold hover:bg-teal-500 transition-colors">Close Prototype</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const mockGeminiAnalysis = (type) => {
            return new Promise(resolve => {
                setTimeout(() => {
                    if (type === 'vision') {
                        resolve({
                            vision: "We will empower our nursing staff by automating vitals data collection. By deploying secure IoT monitors integrated into the EPR, we aim to reduce administrative burden, providing real-time patient data to reduce clinical risk and enhance ward efficiency.",
                            why: "Manual transcription is causing high error rates and contributing significantly to staff burnout.",
                            what: "Deploying integrated IoT vitals monitors across all general wards.",
                            how: "Through targeted training, dedicated floorwalkers, and a phased rollout starting with Ward 4.",
                            caseForChange: {
                                drivers: ["High error rates in manual transcription", "Excessive administrative burden on clinical staff", "National NHS digital transformation mandate"],
                                benefits: ["2 hours saved per nurse per shift", "30% reduction in transcription errors", "Faster response to patient deterioration"],
                                risks: ["Patient safety incidents due to missed or incorrectly recorded vital signs", "Continued staff burnout and low morale"]
                            },
                            predictiveIntelligence: {
                                match: "We found 63 similar 'IoT Vitals' projects across acute care settings (34 Completed, 29 In Progress). You are well supported by existing blueprints.",
                                topResistance: "Ward Managers fearing increased screen time during shift handovers.",
                                topSuccessFactor: "Mandating 'Floorwalkers' during Phase 4 (Deployment) saw a 45% faster ADKAR adoption rate.",
                                timeline: "4.5 mo",
                                resources: [
                                    { title: "EPR IoT Integration Blueprint", type: "NHS Digital Standard", icon: "FileText", bg: "bg-blue-100", color: "text-blue-700" },
                                    { title: "Guy's & St Thomas Case Study", type: "Published Success Story", icon: "Award", bg: "bg-emerald-100", color: "text-emerald-700" },
                                    { title: "Ward Floorwalker Guidelines", type: "HPCA Toolkit Template", icon: "BookOpen", bg: "bg-purple-100", color: "text-purple-700" }
                                ],
                                communityThreads: [
                                    { question: "How did you overcome Wi-Fi deadzones during IoT rollout?", replies: 14, author: "J. Smith (Trust PM)" },
                                    { question: "Best way to train night staff without mandatory daytime classes?", replies: 28, author: "S. Patel (Change Lead)" }
                                ]
                            }
                        });
                    } else if (type === 'stakeholder') {
                        resolve([
                            { id: 1, name: "Dr. Sarah Jenkins", role: "Clinical Lead", cpig: "Influencer", engagement: "High - 1:1 Briefings" },
                            { id: 2, name: "Ward Nurses", role: "End Users", cpig: "Customer", engagement: "Medium - Huddles" },
                            { id: 3, name: "IT Operations", role: "Tech Support", cpig: "Provider", engagement: "High - Weekly Sync" }
                        ]);
                    } else if (type === 'forcefield') {
                        resolve({
                            driving: [{ force: "Mandate to reduce errors", score: 5 }, { force: "Funding approved", score: 4 }],
                            restraining: [{ force: "Staff burnout", score: 4 }, { force: "Poor ward Wi-Fi", score: 3 }]
                        });

            const personas = [
                { id: 1, name: "Dr. Sarah Jenkins", role: "Clinical Lead", influence: 90, resistance: 85, triggers: ["Long emails", "Corporate jargon", "Tech glitches"], motivators: ["Patient safety", "Time saved"], colorClass: "bg-rose-100 text-rose-700", borderClass: "border-rose-200", initialMsg: "I've just seen the brief for this 'Virtual Ward' rollout. This looks like more administrative screen time for my team. We are already stretched too thin." },
                { id: 2, name: "Mark Thorne", role: "Ward Manager", influence: 70, resistance: 40, triggers: ["Staff burnout", "Surprise training schedules"], motivators: ["Smooth rotas", "Team morale"], colorClass: "bg-blue-100 text-blue-700", borderClass: "border-blue-200", initialMsg: "Hi. I'm open to the new system, but you can't pull my nurses off the floor for a 2-hour classroom session. It's not happening.", videoId: "oTWMUbs1ggE" },
                { id: 3, name: "Chloe Davies", role: "Night Shift Nurse", influence: 30, resistance: 90, triggers: ["Day-shift bias", "Complex logins"], motivators: ["Ease of use", "Being heard"], colorClass: "bg-amber-100 text-amber-700", borderClass: "border-amber-200", initialMsg: "Nobody ever asks the night staff how these things work at 3 AM. The Wi-Fi is spotty in Ward 4. How is this monitor supposed to sync?" }
            ];

            const [selectedPersona, setSelectedPersona] = useState(personas[0]);
            const [activeMode, setActiveMode] = useState('tester'); // 'chat', 'tester', or 'video'
            const [chat, setChat] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [draftMessage, setDraftMessage] = useState('');
            const [testResult, setTestResult] = useState(null);
            const [isTesting, setIsTesting] = useState(false);

            useEffect(() => {
                setChat([{ sender: 'ai', text: selectedPersona.initialMsg }]);
                setTestResult(null);
                // Automatically show the video tab if the persona has a video briefing
                if (selectedPersona.videoId) {
                    setActiveMode('video');
                } else {
                    setActiveMode('tester');
                }
            }, [selectedPersona]);

            const handleChatSend = () => {
                if (!chatInput.trim()) return;
                const newChat = [...chat, { sender: 'user', text: chatInput }];
                setChat(newChat);
                setChatInput('');
                setTimeout(() => {
                    setChat([...newChat, { sender: 'ai', text: "Good use of empathy! However, you still need to address the core concern. Try focusing on the 'What's In It For Me' (WIIFM) principle for this specific role." }]);
                }, 1500);
            };

            const handleTestMessage = () => {
                if (!draftMessage.trim()) return;
                setIsTesting(true);
                setTimeout(() => {
                    let reaction = "";
                    let coach = "";
                    if (selectedPersona.id === 1) {
                        if (draftMessage.length > 120) {
                            reaction = "I stopped reading after the first paragraph. I don't have time for essays on a busy shift. Just tell me what I need to do.";
                            coach = "Dr. Jenkins is highly time-poor. Use bullet points and put the 'Bottom Line Up Front' (BLUF). Try editing to be much shorter.";
                        } else {
                            reaction = "Okay, this is concise. I see how this saves time on charting. I'll read the attached one-pager.";
                            coach = "Excellent! You matched her communication style by keeping it brief and focusing on the core benefit.";
                        }
                    } else if (selectedPersona.id === 2) {
                        reaction = "Thanks for the update. I'll share this in the morning huddle, but I still need to know how we are handling shift cover during the rollout.";
                        coach = "Good tone. Mark cares about logistics. Make sure you follow up with a clear plan for covering rotas during the transition.";
                    } else {
                        reaction = "Fine. As long as it doesn't take 10 minutes to log in at 2 AM, we'll try it.";
                        coach = "You successfully de-escalated. Night staff often feel forgotten, so acknowledging their specific pain points builds immense trust.";
                    }
                    setTestResult({ reaction, coach });
                    setIsTesting(false);
                }, 1500);
            };

            if (showIntro) {
                return (
                    <div className="max-w-6xl mx-auto space-y-6 pb-10 animate-fade-in-up">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="bg-hpca-navy p-10 md:p-16 text-center relative overflow-hidden">
                                <div className="absolute top-0 right-0 -mr-10 -mt-10 text-white/5 pointer-events-none"><Icons.Users className="w-96 h-96"/></div>
                                <div className="relative z-10 w-24 h-24 mx-auto bg-white/10 backdrop-blur-md rounded-3xl flex items-center justify-center mb-8 shadow-inner border border-white/20">
                                    <Icons.Target className="text-hpca-teal w-12 h-12" />
                                </div>
                                <h2 className="text-3xl md:text-4xl font-bold text-white mb-6 relative z-10 tracking-tight">Training Sandbox Overview</h2>
                                <p className="text-lg text-slate-300 max-w-4xl mx-auto font-medium relative z-10 leading-relaxed">
                                    The Sandbox is a multi-purpose, psychologically safe environment designed for the entire NHS Change community. It enables professionals to refine their strategy, test toolkits against simulated resistance, collaborate on complex scenarios, and support formal HPCA learning journeys.
                                </p>
                            </div>
                            
                            <div className="p-8 md:p-12">
                                <h3 className="text-xl font-bold text-hpca-navy mb-8 text-center uppercase tracking-wider text-sm">Sandbox Capabilities & Use Cases</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center hover:shadow-md transition-shadow">
                                        <div className="w-14 h-14 bg-hpca-lightBlue text-hpca-blue rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm"><Icons.Brain className="w-7 h-7"/></div>
                                        <h4 className="font-bold text-hpca-navy mb-3 text-base">CM Strategy Formulation</h4>
                                        <p className="text-sm text-slate-600 leading-relaxed font-medium">Develop, iterate, and pressure-test overarching change narratives and ADKAR strategies before presenting to Trust Boards.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center hover:shadow-md transition-shadow">
                                        <div className="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm"><Icons.Layers className="w-7 h-7"/></div>
                                        <h4 className="font-bold text-hpca-navy mb-3 text-base">Testing CM Tools</h4>
                                        <p className="text-sm text-slate-600 leading-relaxed font-medium">Experiment with Nudge Comms, CPIG mapping, and LNA tools on AI stakeholders to gauge reactions before live deployment.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center hover:shadow-md transition-shadow">
                                        <div className="w-14 h-14 bg-status-success/20 text-status-success rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm"><Icons.Users className="w-7 h-7"/></div>
                                        <h4 className="font-bold text-hpca-navy mb-3 text-base">Peer Collaboration</h4>
                                        <p className="text-sm text-slate-600 leading-relaxed font-medium">Work alongside other NHS practitioners in shared instances, roleplaying scenarios, and exchanging successful tactics.</p>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center hover:shadow-md transition-shadow">
                                        <div className="w-14 h-14 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm"><Icons.Award className="w-7 h-7"/></div>
                                        <h4 className="font-bold text-hpca-navy mb-3 text-base">HPCA Course Support</h4>
                                        <p className="text-sm text-slate-600 leading-relaxed font-medium">Seamlessly integrates with official HPCA accreditation pathways, providing assessed, practical modules for learners.</p>
                                    </div>
                                </div>

                                <div className="flex justify-center border-t border-slate-100 pt-10">
                                    <button onClick={() => setShowIntro(false)} className="bg-hpca-navy hover:bg-hpca-blue text-white px-10 py-4 rounded-xl font-bold transition-all shadow-md hover:shadow-lg flex items-center text-lg group">
                                        Launch Demo: Persona Resistance <Icons.MonitorPlay className="ml-3 w-6 h-6 group-hover:scale-110 transition-transform" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto space-y-6 pb-10 animate-fade-in-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col md:flex-row justify-between md:items-center mb-6 pb-6 border-b border-slate-100 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-hpca-navy flex items-center"><Icons.MonitorPlay className="mr-3 text-hpca-teal w-6 h-6"/> AI Resistance Sandbox</h2>
                                <p className="text-sm text-slate-500 font-medium mt-1">Cohort 42 - Gamified Stakeholder Management & Messaging Tester</p>
                            </div>
                            <div className="bg-hpca-lightBlue/50 text-hpca-blue px-4 py-2 rounded-lg text-sm font-bold border border-hpca-teal/20 flex items-center">
                                <Icons.Sparkles className="w-4 h-4 mr-2"/> Powered by Gemini
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Left Column: Persona Selection */}
                            <div className="lg:col-span-1 space-y-4">
                                <h3 className="font-bold text-hpca-navy text-sm uppercase tracking-wider mb-2">Select Target Persona</h3>
                                {personas.map(p => (
                                    <div 
                                        key={p.id} 
                                        onClick={() => setSelectedPersona(p)}
                                        className={`p-4 rounded-xl border-2 cursor-pointer transition-all ${selectedPersona.id === p.id ? `border-hpca-blue bg-slate-50 shadow-md scale-[1.02]` : `border-slate-100 bg-white hover:border-hpca-teal/30`}`}
                                    >
                                        <div className="flex items-center mb-3">
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg mr-3 shadow-sm ${p.colorClass}`}>{p.name.charAt(0)}</div>
                                            <div>
                                                <h4 className="font-bold text-hpca-navy">{p.name}</h4>
                                                <p className="text-xs text-slate-500 font-medium">{p.role}</p>
                                            </div>
                                        </div>
                                        <div className="space-y-2 mb-3">
                                            <div>
                                                <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Influence</span><span>{p.influence}%</span></div>
                                                <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden"><div className="bg-hpca-teal h-full" style={{width: `${p.influence}%`}}></div></div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Resistance</span><span>{p.resistance}%</span></div>
                                                <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden"><div className="bg-status-danger h-full" style={{width: `${p.resistance}%`}}></div></div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Right Column: Interaction Area */}
                            <div className="lg:col-span-2 flex flex-col bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden shadow-inner h-[600px]">
                                
                                {/* Top Tab Bar */}
                                <div className="flex bg-white border-b border-slate-200">
                                    {selectedPersona.videoId && (
                                        <button onClick={() => setActiveMode('video')} className={`flex-1 py-4 text-sm font-bold transition-colors flex items-center justify-center ${activeMode === 'video' ? 'text-hpca-blue border-b-2 border-hpca-teal bg-hpca-lightBlue/20' : 'text-slate-500 hover:bg-slate-50'}`}>
                                            <Icons.MonitorPlay className="w-4 h-4 mr-2"/> Video Briefing
                                        </button>
                                    )}
                                    <button onClick={() => setActiveMode('tester')} className={`flex-1 py-4 text-sm font-bold transition-colors ${activeMode === 'tester' ? 'text-hpca-blue border-b-2 border-hpca-teal bg-hpca-lightBlue/20' : 'text-slate-500 hover:bg-slate-50'}`}>
                                        Message Tester
                                    </button>
                                    <button onClick={() => setActiveMode('chat')} className={`flex-1 py-4 text-sm font-bold transition-colors ${activeMode === 'chat' ? 'text-hpca-blue border-b-2 border-hpca-teal bg-hpca-lightBlue/20' : 'text-slate-500 hover:bg-slate-50'}`}>
                                        Live Roleplay
                                    </button>
                                </div>

                                {/* Mode: Video Briefing */}
                                {activeMode === 'video' && selectedPersona.videoId && (
                                    <div className="p-6 flex-1 flex flex-col items-center justify-center animate-fade-in-up bg-slate-900 relative">
                                        <div className="w-full max-w-2xl aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-700 relative z-10 group">
                                            <iframe
                                                width="100%"
                                                height="100%"
                                                src={`https://www.youtube.com/embed/${selectedPersona.videoId}?rel=0&modestbranding=1`}
                                                title="Persona Video Briefing"
                                                frameBorder="0"
                                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                allowFullScreen
                                            ></iframe>
                                            
                                            {/* Pitch Fallback: In case the preview environment blocks the iframe */}
                                            <div className="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <a 
                                                    href={`https://youtu.be/${selectedPersona.videoId}`} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center transition-all shadow-lg"
                                                    title="Open in new tab if video fails to load"
                                                >
                                                    <Icons.ExternalLink className="w-3.5 h-3.5 mr-1.5"/> Watch externally
                                                </a>
                                            </div>
                                        </div>
                                        <div className="mt-8 text-center relative z-10">
                                            <p className="text-slate-300 text-sm mb-5 font-medium">Watch the stakeholder's reaction, then choose your response strategy.</p>
                                            <div className="flex space-x-4 justify-center">
                                                <button onClick={() => setActiveMode('tester')} className="bg-hpca-blue hover:bg-blue-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center shadow-md">
                                                    <Icons.FileText className="w-4 h-4 mr-2"/> Draft an Email
                                                </button>
                                                <button onClick={() => setActiveMode('chat')} className="bg-hpca-teal hover:bg-teal-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center shadow-md">
                                                    <Icons.MessageSquare className="w-4 h-4 mr-2"/> Start Live Chat
                                                </button>
                                            </div>
                                            <a 
                                                href={`https://youtu.be/${selectedPersona.videoId}`} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="inline-block mt-6 text-xs text-slate-500 hover:text-slate-300 transition-colors underline decoration-slate-600 underline-offset-4"
                                            >
                                                Video not loading in this preview window? Click here.
                                            </a>
                                        </div>
                                        {/* Background ambient glow */}
                                        <div className="absolute inset-0 bg-hpca-blue/10 blur-[100px] pointer-events-none"></div>
                                    </div>
                                )}

                                {/* Mode: Message Tester */}
                                {activeMode === 'tester' && (
                                    <div className="p-6 flex-1 overflow-y-auto flex flex-col animate-fade-in-up">
                                        <div className="bg-hpca-navy p-4 rounded-xl mb-6 text-white shadow-md">
                                            <h4 className="font-bold text-sm mb-2 flex items-center"><Icons.Target className="w-4 h-4 mr-2 text-hpca-teal"/> Analyzing: {selectedPersona.name}</h4>
                                            <div className="flex gap-4 text-xs">
                                                <div><span className="text-slate-400 block mb-1">Triggers (Avoid)</span><span className="font-medium text-rose-300">{selectedPersona.triggers.join(', ')}</span></div>
                                                <div><span className="text-slate-400 block mb-1">Motivators (Focus)</span><span className="font-medium text-emerald-300">{selectedPersona.motivators.join(', ')}</span></div>
                                            </div>
                                        </div>

                                        <label className="block text-sm font-bold text-hpca-navy mb-2">Draft your communication (Email, Slack, Poster text):</label>
                                        <textarea 
                                            value={draftMessage} 
                                            onChange={(e) => setDraftMessage(e.target.value)} 
                                            placeholder={`Type a message to convince ${selectedPersona.name.split(' ')[0]} to adopt the new system...`} 
                                            className="w-full flex-1 min-h-[150px] border border-slate-300 rounded-xl p-4 text-sm focus:ring-2 focus:ring-hpca-teal focus:border-hpca-teal outline-none resize-none shadow-inner mb-4"
                                        ></textarea>
                                        
                                        <button onClick={handleTestMessage} disabled={isTesting || !draftMessage.trim()} className={`w-full py-3.5 rounded-xl text-sm font-bold text-white flex justify-center items-center transition-all shadow-md mb-6 ${draftMessage.trim() ? 'bg-hpca-navy hover:bg-hpca-blue' : 'bg-slate-300 cursor-not-allowed'}`}>
                                            {isTesting ? 'AI Evaluating Tone & Content...' : `Test Message on ${selectedPersona.name}`} <Icons.Send className="ml-2 w-4 h-4"/>
                                        </button>

                                        {testResult && (
                                            <div className="animate-fade-in-up space-y-4">
                                                <div className="flex items-start bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm mr-3 shrink-0 ${selectedPersona.colorClass}`}>{selectedPersona.name.charAt(0)}</div>
                                                    <div>
                                                        <h5 className="text-xs font-bold text-slate-500 mb-1">{selectedPersona.name}'s Reaction:</h5>
                                                        <p className="text-sm font-medium text-hpca-navy">"{testResult.reaction}"</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-start bg-hpca-lightBlue/30 p-4 rounded-xl border border-hpca-teal/20 shadow-sm">
                                                    <div className="w-8 h-8 rounded-full bg-hpca-teal text-white flex items-center justify-center mr-3 shrink-0"><Icons.Brain className="w-4 h-4"/></div>
                                                    <div>
                                                        <h5 className="text-xs font-bold text-hpca-blue uppercase tracking-wider mb-1">AI Coach Feedback:</h5>
                                                        <p className="text-sm font-medium text-slate-700">{testResult.coach}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Mode: Live Roleplay */}
                                {activeMode === 'chat' && (
                                    <div className="flex flex-col h-full animate-fade-in-up">
                                        <div className="flex-1 p-4 overflow-y-auto space-y-4">
                                            {chat.map((msg, i) => (
                                                <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                    {msg.sender === 'ai' && <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm mr-2 shrink-0 ${selectedPersona.colorClass} mt-1`}>{selectedPersona.name.charAt(0)}</div>}
                                                    <div className={`max-w-[80%] p-3.5 rounded-2xl text-sm font-medium shadow-sm ${msg.sender === 'user' ? 'bg-hpca-navy text-white rounded-br-none' : 'bg-white text-slate-700 border border-slate-200 rounded-bl-none'}`}>
                                                        {msg.text}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="p-4 bg-white border-t border-slate-200 flex gap-2">
                                            <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleChatSend()} placeholder={`Reply to ${selectedPersona.name}...`} className="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-hpca-teal focus:ring-1 focus:ring-hpca-teal shadow-inner" />
                                            <button onClick={handleChatSend} className="bg-hpca-navy hover:bg-hpca-blue text-white px-5 rounded-xl font-bold transition-colors flex items-center"><Icons.Send className="w-4 h-4"/></button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LearningPortfolio = () => {
            const [activeTab, setActiveTab] = useState('achievements');
            
            const projects = [
                { name: "Digital Vitals Sync (IoT)", phase: "Completed", icon: Icons.CheckCircle, colorClass: "bg-status-success/20 text-status-success", badgeClass: "bg-status-success/10 text-status-success border-status-success/30", summary: "Saved 2 hours per nurse per shift. Change sustained over 6-month review period with 92% ADKAR reinforcement score." },
                { name: "EPR Migration - Ward 4", phase: "Completed", icon: Icons.CheckCircle, colorClass: "bg-status-success/20 text-status-success", badgeClass: "bg-status-success/10 text-status-success border-status-success/30", summary: "Achieved 95% adoption rate within 2 weeks. Zero critical clinical transcription errors post-launch." },
                { name: "Virtual Wards Pilot", phase: "Phase 4: Deployment", icon: Icons.MonitorPlay, colorClass: "bg-hpca-lightBlue text-hpca-blue", badgeClass: "bg-hpca-lightBlue/50 text-hpca-blue border-hpca-teal/30", summary: "Go-Live scheduled for next week. Digital Adoption Walkthroughs (DAT) configured and floorwalkers mobilized." },
                { name: "Outpatient Self-Check-in", phase: "Phase 1: Pre-Discovery", icon: Icons.Brain, colorClass: "bg-status-warning/20 text-amber-700", badgeClass: "bg-status-warning/10 text-amber-800 border-status-warning/30", summary: "Change vision defined. CPIG stakeholder mapping and Case for Change currently underway." },
                { name: "e-Prescribing Rollout", phase: "Phase 1: Pre-Discovery", icon: Icons.Brain, colorClass: "bg-status-warning/20 text-amber-700", badgeClass: "bg-status-warning/10 text-amber-800 border-status-warning/30", summary: "Initial executive engagement. Drafting the Compelling Case for Change." }
            ];

            return (
                <div className="max-w-6xl mx-auto space-y-6 flex flex-col h-full animate-fade-in-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between shrink-0">
                        <div>
                            <h2 className="text-2xl font-bold text-hpca-navy mb-1 flex items-center"><Icons.Award className="mr-3 text-hpca-teal w-6 h-6"/> Digital Adoption CV</h2>
                            <p className="text-slate-500 font-medium">Track your experiential learning and capability building.</p>
                        </div>
                        <button className="bg-hpca-lightBlue text-hpca-blue px-5 py-2.5 rounded-xl font-bold hover:bg-hpca-teal/20 transition-colors flex items-center shadow-sm">
                            <Icons.Download className="mr-2 w-4 h-4"/> Export CV
                        </button>
                    </div>

                    <div className="flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden shrink-0">
                        <button onClick={() => setActiveTab('achievements')} className={`flex-1 py-4 px-6 text-sm font-bold transition-all flex items-center justify-center ${activeTab === 'achievements' ? 'bg-hpca-lightBlue/30 text-hpca-blue shadow-inner border-b-2 border-b-hpca-teal' : 'text-slate-500 hover:bg-slate-50 hover:text-hpca-navy'}`}>
                            <Icons.Sparkles className={`w-4 h-4 mr-2 ${activeTab === 'achievements' ? 'text-hpca-teal' : ''}`} /> Achievements & CPD
                        </button>
                        <button onClick={() => setActiveTab('projects')} className={`flex-1 py-4 px-6 text-sm font-bold transition-all flex items-center justify-center border-l border-slate-200 ${activeTab === 'projects' ? 'bg-hpca-lightBlue/30 text-hpca-blue shadow-inner border-b-2 border-b-hpca-teal' : 'text-slate-500 hover:bg-slate-50 hover:text-hpca-navy'}`}>
                            <Icons.Layers className={`w-4 h-4 mr-2 ${activeTab === 'projects' ? 'text-hpca-teal' : ''}`} /> Project Experience Log
                        </button>
                    </div>
                    
                    <div className="flex-1 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 overflow-y-auto custom-scrollbar">

                                <div className="flex items-center space-x-2 bg-hpca-lightBlue/50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                    <span className="text-xs font-bold text-hpca-navy uppercase tracking-wider hidden sm:inline">My Level:</span>
                                    <select value={experienceLevel} onChange={(e) => setExperienceLevel(e.target.value)} className="text-sm font-bold text-hpca-blue bg-transparent outline-none cursor-pointer">
                                        <option value="novice">Accidental CM</option>
                                        <option value="intermediate">Project Manager</option>
                                        <option value="expert">Change Professional</option>
                                    </select>
                                </div>
                            </div>
                        </header>
                        
                        {}
                        <main className="p-4 md:p-8 flex-1 relative bg-slate-50">
                            <div className="max-w-[1600px] w-full mx-auto h-full flex flex-col">
                                {currentStep === 1 && <Dashboard navigateTo={setCurrentStep} experienceLevel={experienceLevel} />}
                                {currentStep === 2 && <Phase1PreDiscovery onComplete={() => setCurrentStep(3)} experienceLevel={experienceLevel} />}
                                {currentStep === 3 && <AppSuite experienceLevel={experienceLevel} />}
                                {currentStep === 4 && <Phase4Deployment />}
                                {currentStep === 5 && <Phase5PostDeployment />}
                                {currentStep === 6 && <LearningPortfolio />}
                                {currentStep === 7 && <TrainingSimulator />}
                                {currentStep === 8 && <EnterpriseAnalytics />}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
