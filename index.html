<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHS AI Change Management Portal (V3)</title>
    <!-- Tailwind CSS for HPCA Branding -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .ai-gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ai-gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Comprehensive Icon Library (Lucide equivalents)
        const Icons = {
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Target: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            MessageSquare: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            PieChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>,
            List: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Scale: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>,
            BookOpen: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            HelpCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Close: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Layers: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>,
            Award: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Github: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>,
            MonitorPlay: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="m10 7 5 3-5 3Z"/></svg>,
            BarChart2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
            ExternalLink: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        };

        const InfoPopup = ({ title, what, why }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="relative inline-flex items-center ml-2 align-middle">
                    <button onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }} className="text-violet-400 hover:text-violet-600 focus:outline-none transition-colors" title="Learn More: What & Why">
                        <Icons.HelpCircle />
                    </button>
                    {isOpen && (
                        <div className="absolute z-[100] w-72 md:w-80 p-5 mt-2 left-0 top-full bg-white border border-violet-100 shadow-2xl rounded-xl text-sm font-normal text-left animate-fade-in-up">
                            <div className="flex justify-between items-start mb-3 border-b border-slate-100 pb-2">
                                <h4 className="font-bold text-violet-800 flex items-center"><Icons.Brain /><span className="ml-2">{title}</span></h4>
                                <button onClick={(e) => { e.stopPropagation(); setIsOpen(false); }} className="text-slate-400 hover:text-slate-600 bg-slate-50 rounded p-1"><Icons.Close /></button>
                            </div>
                            <div className="mb-3">
                                <span className="font-semibold text-slate-800 block mb-1 text-[10px] uppercase tracking-wider">The What</span>
                                <p className="text-slate-600 text-xs leading-relaxed">{what}</p>
                            </div>
                            <div>
                                <span className="font-semibold text-slate-800 block mb-1 text-[10px] uppercase tracking-wider">The Why</span>
                                <p className="text-slate-600 text-xs leading-relaxed">{why}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AITypingEffect = ({ text, onComplete, speed = 15 }) => {
            const [displayedText, setDisplayedText] = useState("");
            useEffect(() => {
                let i = 0;
                setDisplayedText("");
                const timer = setInterval(() => {
                    if (i < text.length) {
                        setDisplayedText((prev) => prev + text.charAt(i));
                        i++;
                    } else {
                        clearInterval(timer);
                        if (onComplete) onComplete();
                    }
                }, speed);
                return () => clearInterval(timer);
            }, [text, speed]);
            return <span>{displayedText}</span>;
        };

        const PhaseTracker = ({ activePhase, title, description, whatNext, toolkitRef = "Toolkit V3" }) => {
            const [showCommunityModal, setShowCommunityModal] = useState(false);
            const [showToolkitModal, setShowToolkitModal] = useState(false);
            const [msg, setMsg] = useState("");
            const [msgSent, setMsgSent] = useState(false);
            const phases = [1, 2, 3, 4, 5];
            
            return (
                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8 animate-fade-in-up">
                    {/* Visual Stepper */}
                    <div className="flex items-center justify-between mb-8 relative max-w-2xl mx-auto px-4">
                        <div className="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-100 z-0 rounded-full"></div>
                        <div className="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-violet-500 z-0 rounded-full transition-all duration-500" style={{ width: `${((activePhase - 1) / 4) * 100}%` }}></div>
                        
                        {phases.map(p => (
                            <div key={p} className={`z-10 flex flex-col items-center group`}>
                                <div className={`flex items-center justify-center w-8 h-8 rounded-full font-bold text-xs border-2 transition-all duration-300 ${p === activePhase ? 'bg-violet-600 border-violet-600 text-white shadow-lg scale-110' : p < activePhase ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-slate-300 text-slate-400'}`}>
                                    {p < activePhase ? <Icons.Check className="w-4 h-4" /> : p}
                                </div>
                                <span className={`absolute mt-10 text-[10px] font-bold uppercase tracking-wider ${p === activePhase ? 'text-violet-700' : 'text-slate-400'} hidden sm:block`}>Phase {p}</span>
                            </div>
                        ))}
                    </div>

                    {/* Introductory Context */}
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-3 flex items-center">
                            <Icons.Brain className="w-6 h-6 mr-3 text-violet-600" />
                            {title}
                        </h2>
                        <p className="text-base text-slate-600 leading-relaxed mb-5">{description}</p>
                        <div className="bg-violet-50/50 border border-violet-100 p-4 rounded-xl flex items-start mb-6">
                            <Icons.Activity className="w-5 h-5 text-violet-600 mr-3 mt-0.5 shrink-0" />
                            <p className="text-sm text-violet-900"><strong>What's Next:</strong> {whatNext}</p>
                        </div>
                        
                        {/* HPCA Toolkit and Community Resources */}
                        <div className="flex flex-col sm:flex-row sm:items-center gap-3 pt-5 border-t border-slate-100">
                            <button onClick={() => setShowToolkitModal(true)} className="flex items-center justify-center px-4 py-2.5 bg-slate-50 border border-slate-200 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-100 hover:text-violet-700 transition-colors shadow-sm">
                                <Icons.BookOpen className="w-4 h-4 mr-2 text-slate-400"/> Ref: {toolkitRef} <Icons.ExternalLink className="w-3.5 h-3.5 ml-2 text-slate-400"/>
                            </button>
                            <button onClick={() => setShowCommunityModal(true)} className="flex items-center justify-center px-4 py-2.5 bg-violet-50 border border-violet-200 text-violet-700 rounded-xl text-sm font-medium hover:bg-violet-100 transition-colors shadow-sm">
                                <Icons.Users className="w-4 h-4 mr-2"/> Ask the HPCA Community
                            </button>
                        </div>
                    </div>

                    {/* Community Modal */}
                    {showCommunityModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={() => setShowCommunityModal(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center"><Icons.Users className="mr-2 text-violet-600"/> HPCA Community Hub</h3>
                                    <button onClick={() => setShowCommunityModal(false)} className="text-slate-400 hover:text-slate-600"><Icons.Close /></button>
                                </div>
                                <div className="p-6">
                                    <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl flex items-start mb-5">
                                        <Icons.HelpCircle className="w-5 h-5 text-blue-600 mr-3 shrink-0 mt-0.5" />
                                        <p className="text-sm text-blue-800 leading-relaxed">You are asking for peer advice related to <strong>Phase {activePhase}</strong>. Over 4,000 NHS Change Professionals are active in the community ready to help.</p>
                                    </div>
                                    {msgSent ? (
                                        <div className="text-center py-8 animate-fade-in-up">
                                            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                                <Icons.CheckCircle className="w-8 h-8" />
                                            </div>
                                            <h4 className="text-lg font-bold text-slate-800 mb-2">Question Posted to the Network!</h4>
                                            <p className="text-sm text-slate-600 mb-6">Your query has been shared. You will receive an email notification as soon as an HPCA peer replies.</p>
                                            <button onClick={() => { setShowCommunityModal(false); setTimeout(() => setMsgSent(false), 500); }} className="bg-slate-900 text-white px-8 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-800 shadow-md">Done</button>
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in-up">
                                            <label className="block text-sm font-bold text-slate-700 mb-2">What do you need help with?</label>
                                            <textarea rows="4" value={msg} onChange={e => setMsg(e.target.value)} placeholder="e.g., How did other Trusts handle resistance from clinical leads during this phase?" className="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none resize-none mb-4 shadow-inner"></textarea>
                                            <div className="flex justify-end gap-3 pt-2">
                                                <button onClick={() => setShowCommunityModal(false)} className="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Cancel</button>
                                                <button onClick={() => { if(msg.trim()) setMsgSent(true); }} className={`px-5 py-2.5 rounded-xl text-sm font-medium text-white flex items-center transition-all shadow-md ${msg.trim() ? 'bg-violet-600 hover:bg-violet-700' : 'bg-slate-300 cursor-not-allowed'}`}>
                                                    Post Question <Icons.MessageSquare className="w-4 h-4 ml-2" />
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toolkit Integration Modal */}
                    {showToolkitModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={() => setShowToolkitModal(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center"><Icons.BookOpen className="mr-2 text-violet-600"/> Toolkit Integration</h3>
                                    <button onClick={() => setShowToolkitModal(false)} className="text-slate-400 hover:text-slate-600"><Icons.Close /></button>
                                </div>
                                <div className="p-6 text-center">
                                    <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <Icons.ExternalLink className="w-8 h-8" />

            const ImpactApp = () => {

                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm animate-fade-in-up">

                                </div>
                            </div>

                );

            const LNAApp = () => {

                                    {data.map((row, i) => (

                                            <td className="p-3 text-emerald-700">{row.method}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>
                );
            };

            const CommsApp = () => {
                const [loading, setLoading] = useState(false);
                const [draft, setDraft] = useState("");

                            {activeTab === 'stakeholder' && <StakeholderApp />}
                            {activeTab === 'forcefield' && <ForceFieldApp />}

                            {activeTab === 'lna' && <LNAApp />}
                            {activeTab === 'comms' && <CommsApp />}
                        </div>
                    </div>
                </div>
            );
        };

        const Phase4Deployment = () => {
            const [analyzing, setAnalyzing] = useState(false);
            const [data, setData] = useState(null);
            const handleAnalyze = async () => { setAnalyzing(true); setData(await mockGeminiAnalysis('dat')); setAnalyzing(false); };
            
            return (
                <div className="max-w-4xl mx-auto space-y-6 pb-10">

                        activePhase={4} 
                        title="Phase 4: Deployment"
                        description="It is Go-Live time. This phase is about executing your plans and supporting staff through the physical transition to the new ways of working. A key tool here is the Digital Adoption Walkthrough, which provides immediate on-the-job support to prevent productivity dips."
                        whatNext="After deployment, you will move to Phase 5 to measure adoption and ensure the change is sustained over time."
                        toolkitRef="Toolkit Sec 4.2 (p.52)"
                    />
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-6 flex items-start">
                            <Icons.Layers className="w-5 h-5 text-blue-600 mr-3 shrink-0 mt-0.5" />
                            <div>
                                <h4 className="font-bold text-blue-900 text-sm mb-1">Context & Benefit: Digital Adoption Toolkit (DAT)</h4>
                                <p className="text-sm text-blue-800 leading-relaxed">Traditional classroom training is quickly forgotten. The DAT generates automated, in-app popups and tooltips that guide users step-by-step through the live software, ensuring they have help exactly when they need it.</p>
                            </div>
                        </div>

                        <h3 className="text-lg font-semibold flex items-center mb-3">Generate Go-Live Walkthrough</h3>
                        <p className="text-sm text-slate-500 mb-6">Create in-app guidance based on the high-risk workflows defined in Phase 3.</p>
                        
                        <button onClick={handleAnalyze} disabled={analyzing} className="mb-6 bg-slate-900 text-white px-6 py-3.5 rounded-xl text-sm font-medium hover:bg-slate-800 shadow-md flex items-center transition-all">
                            {analyzing ? 'Generating Sequence...' : 'AI Generate In-App Walkthrough'} <Icons.Sparkles className="ml-2 w-4 h-4"/>

                            <div className="space-y-4 animate-fade-in-up">

                                    <div key={i} className="flex items-start bg-slate-50 p-5 rounded-xl border border-slate-200 shadow-sm hover:border-violet-300 transition-colors">
                                        <div className="w-8 h-8 rounded-full bg-violet-600 text-white text-sm font-bold flex items-center justify-center mr-4 shrink-0 mt-0.5 shadow-md">{step.step}</div>
                                        <div>
                                            <div className="flex items-center space-x-3 mb-2">
                                                <span className="font-bold text-slate-800 text-base">{step.element}</span>
                                                <span className="px-2 py-1 bg-blue-100 text-blue-800 text-[10px] rounded uppercase font-bold tracking-wider">{step.type}</span>
                                            </div>
                                            <p className="text-sm text-slate-600 leading-relaxed">{step.text}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Phase5PostDeployment = () => {
            const [analyzing, setAnalyzing] = useState(false);
            const [data, setData] = useState(null);
            const handleAnalyze = async () => { setAnalyzing(true); setData(await mockGeminiAnalysis('adkar')); setAnalyzing(false); };
            
            return (
                <div className="max-w-4xl mx-auto space-y-6 pb-10">
                    <PhaseTracker 
                        activePhase={5} 
                        title="Phase 5: Post-Deployment"
                        description="The technology is live, but is the change sustained? In this final phase, you must evaluate adoption and reinforce positive behaviors. Use the AI to analyze post-live survey feedback against the ADKAR model to instantly diagnose root causes of resistance."
                        whatNext="Review your Learning Portfolio to see the CPD hours and badges you've earned across this journey!"
                        toolkitRef="Toolkit Sec 5.1 (p.68)"
                    />
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-6 flex items-start">
                            <Icons.Target className="w-5 h-5 text-blue-600 mr-3 shrink-0 mt-0.5" />
                            <div>
                                <h4 className="font-bold text-blue-900 text-sm mb-1">Context & Benefit: ADKAR Gap Analysis</h4>
                                <p className="text-sm text-blue-800 leading-relaxed">It's hard to know *why* staff aren't using a new system. This tool ingests raw survey feedback and maps it to the 5 ADKAR pillars, pinpointing exactly where the change is breaking down so you can apply targeted interventions.</p>
                            </div>
                        </div>

                        <h3 className="text-lg font-semibold flex items-center mb-3">Diagnostic Survey Assessment</h3>
                        <p className="text-sm text-slate-500 mb-6">Analyze raw ward feedback to measure adoption across Awareness, Desire, Knowledge, Ability, and Reinforcement.</p>
                        
                        <button onClick={handleAnalyze} disabled={analyzing} className="mb-6 bg-slate-900 text-white px-6 py-3.5 rounded-xl text-sm font-medium hover:bg-slate-800 shadow-md flex items-center transition-all">

                        </button>
                        
                        {data && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                        { key: 'awareness', label: 'Awareness', ...data.awareness },
                                        { key: 'desire', label: 'Desire', ...data.desire },
                                        { key: 'knowledge', label: 'Knowledge', ...data.knowledge },
                                        { key: 'ability', label: 'Ability', ...data.ability },
                                        { key: 'reinforcement', label: 'Reinforcement', ...data.reinforcement }
                                    ].map((item, i) => (
                                        <div key={i} className={`p-5 rounded-xl border ${item.score < 50 ? 'bg-rose-50 border-rose-200 shadow-sm' : item.score < 75 ? 'bg-amber-50 border-amber-200' : 'bg-emerald-50 border-emerald-200'}`}>
                                            <div className="flex justify-between items-center mb-3 border-b border-white/50 pb-2">
                                                <h4 className="font-bold text-slate-800 uppercase tracking-wider text-xs">{item.label}</h4>
                                                <span className={`font-black text-xl ${item.score < 50 ? 'text-rose-600' : item.score < 75 ? 'text-amber-600' : 'text-emerald-600'}`}>{item.score}%</span>
                                            </div>
                                            <p className="text-sm text-slate-700 leading-relaxed font-medium">{item.comment}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-xl text-white relative overflow-hidden">
                                    <div className="absolute top-0 right-0 -mr-4 -mt-4 text-violet-500/20"><Icons.Sparkles className="w-32 h-32"/></div>
                                    <h4 className="text-xs font-bold text-violet-400 uppercase tracking-wider mb-3 flex items-center relative z-10"><Icons.Brain className="w-4 h-4 mr-2"/> AI Recommended Corrective Action</h4>
                                    <p className="text-base font-medium leading-relaxed relative z-10">{data.action}</p>
                                </div>
                            </div>

                    </div>
                </div>

        };

        const TrainingSimulator = () => {
            const [chat, setChat] = useState([{ sender: 'ai', text: "Welcome to the HPCA Sandbox. You are about to implement 'Virtual Wards'. Your key stakeholder, Dr. Jenkins, is resistant. She says: 'This is just more admin for my team.'" }]);
            const [input, setInput] = useState('');
            const handleSend = () => {
                if (!input.trim()) return;
                const newChat = [...chat, { sender: 'user', text: input }];
                setChat(newChat);
                setInput('');
                setTimeout(() => {
                    setChat([...newChat, { sender: 'ai', text: "Good use of the 'What's In It For Me' (WIIFM) principle! Dr. Jenkins responds: 'I see how it saves bed space, but the tech must be reliable.' (Simulation paused)" }]);
                }, 1500);
            };
            return (
                <div className="max-w-5xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-[calc(100vh-120px)] flex flex-col animate-fade-in-up">

                            <p className="text-sm text-slate-500">Cohort 42 - Scenario: Virtual Wards Resistance Management</p>
                        </div>

                    <div className="flex-1 bg-slate-50 rounded-xl border border-slate-200 p-4 mb-4 overflow-y-auto space-y-4">

                                    {msg.text}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="flex gap-2">
                        <input type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} placeholder="Type your response to Dr. Jenkins..." className="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500" />
                        <button onClick={handleSend} className="bg-slate-900 hover:bg-slate-800 text-white px-6 rounded-xl font-medium transition-colors">Respond</button>
                    </div>
                </div>
            );
        };

            const projects = [
                { 
                    name: "Digital Vitals Sync (IoT)", 
                    phase: "Completed", 
                    icon: Icons.CheckCircle, 
                    colorClass: "bg-emerald-100 text-emerald-600",
                    badgeClass: "bg-emerald-50 text-emerald-700 border-emerald-200", 
                    summary: "Saved 2 hours per nurse per shift. Change sustained over 6-month review period with 92% ADKAR reinforcement score." 
                },
                { 
                    name: "EPR Migration - Ward 4", 
                    phase: "Completed", 
                    icon: Icons.CheckCircle, 
                    colorClass: "bg-emerald-100 text-emerald-600",
                    badgeClass: "bg-emerald-50 text-emerald-700 border-emerald-200", 
                    summary: "Achieved 95% adoption rate within 2 weeks. Zero critical clinical transcription errors post-launch." 
                },
                { 
                    name: "Virtual Wards Pilot", 
                    phase: "Phase 4: Deployment", 
                    icon: Icons.MonitorPlay, 
                    colorClass: "bg-blue-100 text-blue-600",
                    badgeClass: "bg-blue-50 text-blue-700 border-blue-200", 
                    summary: "Go-Live scheduled for next week. Digital Adoption Walkthroughs (DAT) configured and floorwalkers mobilized." 
                },
                { 
                    name: "Outpatient Self-Check-in", 
                    phase: "Phase 1: Pre-Discovery", 
                    icon: Icons.Brain, 
                    colorClass: "bg-amber-100 text-amber-600",
                    badgeClass: "bg-amber-50 text-amber-700 border-amber-200", 
                    summary: "Change vision defined. CPIG stakeholder mapping and Case for Change currently underway." 
                },
                { 
                    name: "e-Prescribing Rollout", 
                    phase: "Phase 1: Pre-Discovery", 
                    icon: Icons.Brain, 
                    colorClass: "bg-amber-100 text-amber-600",
                    badgeClass: "bg-amber-50 text-amber-700 border-amber-200", 
                    summary: "Initial executive engagement. Drafting the Compelling Case for Change." 
                }
            ];

            return (
                <div className="max-w-5xl mx-auto space-y-6 animate-fade-in-up pb-10">

                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-1 flex items-center"><Icons.Award className="mr-3 text-violet-600 w-6 h-6"/> Digital Adoption CV</h2>

                            <Icons.Download className="mr-2 w-4 h-4"/> Export CV

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                                {['Visionary', 'Stakeholder Whisperer', 'Nudge Expert', 'ADKAR Analyst'].map((badge, i) => (
                                    <div key={i} className="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-100 hover:bg-violet-50 hover:border-violet-200 transition-all cursor-pointer group">
                                        <div className="w-14 h-14 rounded-full bg-violet-100 text-violet-600 flex items-center justify-center mb-3 shadow-sm group-hover:scale-110 group-hover:bg-violet-600 group-hover:text-white transition-all"><Icons.Award className="w-6 h-6"/></div>
                                        <span className="text-xs font-bold text-slate-700">{badge}</span>
                                    </div>
                                ))}
                            </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><Icons.History className="mr-2 text-violet-500 w-5 h-5"/> CPD Hours</h3>
                            <div className="flex items-end space-x-2 mb-3">
                                <span className="text-5xl font-black text-violet-600">14.5</span>
                                <span className="text-slate-500 font-medium mb-1.5">hrs logged</span>
                            </div>
                            <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mb-4 shadow-inner">
                                <div className="bg-emerald-500 h-full rounded-full" style={{width: '75%'}}></div>
                            </div>
                            <p className="text-xs text-slate-500 font-medium leading-relaxed">You are in the top 20% of users this month.</p>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center"><Icons.Layers className="mr-2 text-violet-500 w-5 h-5"/> Project Experience Log</h3>
                        <div className="grid grid-cols-1 gap-4">
                            {projects.map((proj, i) => (
                                <div key={i} className="flex items-start p-5 bg-slate-50 rounded-xl border border-slate-100 hover:bg-white hover:shadow-md transition-all group">
                                    <div className={`w-12 h-12 rounded-full ${proj.colorClass} flex items-center justify-center mr-4 shrink-0 shadow-sm group-hover:scale-110 transition-transform`}><proj.icon className="w-6 h-6"/></div>
                                    <div className="flex-1">
                                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-2 gap-2">
                                            <h4 className="font-bold text-slate-800 text-base">{proj.name}</h4>
                                            <span className={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md ${proj.badgeClass} self-start sm:self-auto shadow-sm`}>{proj.phase}</span>
                                        </div>
                                        <p className="text-sm text-slate-600 leading-relaxed font-medium">{proj.summary}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const EnterpriseAnalytics = () => (
            <div className="max-w-5xl mx-auto space-y-6 animate-fade-in-up pb-10">
                <div className="mb-2">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center"><Icons.BarChart2 className="mr-2 text-violet-600"/> NHS E Capability Ecosystem</h2>
                    <p className="text-slate-500">Macro-analytics and predictive toolkit intelligence.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {[
                        { label: "Active Portal Users", val: "4,281", trend: "+12% this month" },
                        { label: "Tools Generated", val: "18,902", trend: "+34% this month" },
                        { label: "Post-Live Success Rate", val: "78%", trend: "+5% vs baseline" }
                    ].map((stat, i) => (
                        <div key={i} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h4 className="text-slate-500 text-sm font-medium mb-2">{stat.label}</h4>
                            <div className="text-3xl font-bold text-slate-800 mb-1">{stat.val}</div>
                            <div className="text-xs font-bold text-emerald-600 bg-emerald-50 inline-block px-2 py-1 rounded">{stat.trend}</div>
                        </div>
                    ))}
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="font-bold text-slate-800 mb-4">Phase Engagement Heatmap</h3>
                        <div className="space-y-4">
                            {[{ phase: "Ph 1: Pre-Discovery", usage: 95 }, { phase: "Ph 2/3: Planning Apps", usage: 82 }, { phase: "Ph 4: DAT Walkthroughs", usage: 45 }, { phase: "Ph 5: Post-Deployment ADKAR", usage: 60 }].map((p, i) => (
                                <div key={i}>
                                    <div className="flex justify-between text-xs font-bold mb-1 text-slate-600"><span>{p.phase}</span><span>{p.usage}%</span></div>
                                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                        <div className="bg-violet-500 h-full rounded-full" style={{width: `${p.usage}%`}}></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 relative overflow-hidden">
                        <div className="absolute top-0 right-0 -mr-4 -mt-4 text-violet-500/20"><Icons.Sparkles className="w-32 h-32"/></div>
                        <h3 className="font-bold text-white mb-4 flex items-center z-10 relative"><Icons.Brain className="mr-2 text-violet-400"/> AI Predictive Toolkit Insights</h3>
                        <div className="space-y-4 z-10 relative">
                            <div className="bg-rose-500/10 border border-rose-500/20 p-4 rounded-xl">
                                <span className="text-rose-400 font-bold text-xs uppercase tracking-wider block mb-1">High-Risk Correlation</span>
                                <p className="text-sm text-slate-300">Projects skipping the <strong className="text-white">Learning Needs Analysis (LNA)</strong> correlate with a 40% drop in 'Ability' scores. <br/><br/><span className="text-violet-300 cursor-pointer hover:underline">→ Recommend mandating LNA for High Impact projects.</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const SplashScreen = ({ onEnter }) => {
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 relative overflow-hidden px-4">
                    {/* Background Decorative Elements */}
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-violet-600/30 blur-[120px] rounded-full pointer-events-none"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/20 blur-[120px] rounded-full pointer-events-none"></div>
                    
                    <div className="max-w-2xl w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 md:p-12 rounded-3xl shadow-2xl relative z-10 animate-fade-in-up text-center">
                        <div className="w-20 h-20 mx-auto bg-gradient-to-br from-violet-500 to-fuchsia-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg border border-white/20">
                            <Icons.Brain className="text-white w-10 h-10" />
                        </div>
                        
                        <h1 className="text-3xl md:text-4xl font-bold text-white mb-2 tracking-tight">
                            HPCA AI Change Portal <span className="text-violet-400">V3</span>
                        </h1>
                        <p className="text-slate-400 text-lg mb-8 font-medium">Interactive Ecosystem Prototype</p>
                        
                        <div className="bg-amber-500/10 border border-amber-500/20 rounded-2xl p-6 mb-8 text-left">
                            <div className="flex items-center mb-3">
                                <Icons.HelpCircle className="w-6 h-6 text-amber-400 mr-3 shrink-0" />
                                <h3 className="text-amber-400 font-bold text-lg">Simulation Notice</h3>
                            </div>
                            <p className="text-slate-300 text-sm leading-relaxed mb-4">
                                Welcome to the HPCA demonstration environment. Please note that this is a <strong>high-fidelity interactive prototype</strong> designed to showcase the strategic vision for the NHS England partnership.
                            </p>
                            <ul className="text-slate-400 text-sm space-y-2">
                                <li className="flex items-start"><Icons.Check className="w-4 h-4 text-amber-500 mr-2 shrink-0 mt-0.5" /> <strong>Restricted Functionality:</strong> Tools operate using simulated, pre-defined NHS scenarios.</li>
                                <li className="flex items-start"><Icons.Check className="w-4 h-4 text-amber-500 mr-2 shrink-0 mt-0.5" /> <strong>Mock AI Responses:</strong> Wait times and AI outputs are mocked to ensure a seamless pitch experience.</li>
                                <li className="flex items-start"><Icons.Check className="w-4 h-4 text-amber-500 mr-2 shrink-0 mt-0.5" /> <strong>No Persistent Data:</strong> Any text you input will reset when the browser is refreshed.</li>
                            </ul>
                        </div>
                        
                        <button 
                            onClick={onEnter} 
                            className="bg-white text-slate-900 hover:bg-slate-100 px-8 py-3.5 rounded-xl font-bold transition-all shadow-md flex items-center justify-center w-full sm:w-auto mx-auto group"
                        >
                            Acknowledge & Enter Simulation <Icons.MonitorPlay className="ml-2 w-5 h-5 group-hover:scale-110 transition-transform" />
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [currentStep, setCurrentStep] = useState(1);
            const [experienceLevel, setExperienceLevel] = useState("novice");
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isLiveMode, setIsLiveMode] = useState(false);
            const [apiKey, setApiKey] = useState('');

            const steps = [
                { id: 1, name: "Dashboard Overview", icon: Icons.Activity },
                { id: 2, name: "Ph 1: Pre-Discovery", icon: Icons.Brain },
                { id: 3, name: "Ph 2/3: Plan & Design", icon: Icons.Settings },
                { id: 4, name: "Ph 4: Deployment", icon: Icons.MonitorPlay },
                { id: 5, name: "Ph 5: Post-Live (ADKAR)", icon: Icons.Target },
                { id: 6, name: "Learning Portfolio", icon: Icons.Award },
                { id: 7, name: "Training Sandbox", icon: Icons.Users },
                { id: 8, name: "Enterprise Analytics", icon: Icons.BarChart2 }
            ];

            if (showSplash) {
                return <SplashScreen onEnter={() => setShowSplash(false)} />;
            }

            return (
                <div className="flex h-screen bg-slate-50 text-slate-900 font-sans overflow-hidden">
                    
                    {/* Settings Modal (BYOK) */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center"><Icons.Key className="mr-2 text-violet-600"/> AI Connection Settings</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600"><Icons.Close /></button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white shadow-sm">
                                        <div>
                                            <div className="font-bold text-slate-800 text-sm">Simulation Mode</div>
                                            <div className="text-xs text-slate-500 mt-0.5">Guaranteed demo data (No API key needed)</div>
                                        </div>
                                        <button onClick={() => setIsLiveMode(false)} className={`w-12 h-6 rounded-full transition-colors relative ${!isLiveMode ? 'bg-violet-600' : 'bg-slate-200'}`}>
                                            <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-all ${!isLiveMode ? 'left-7' : 'left-1'}`}></div>
                                        </button>
                                    </div>
                                    <div className={`p-5 rounded-xl border transition-colors ${isLiveMode ? 'border-violet-300 bg-violet-50/50 shadow-inner' : 'border-slate-200 bg-slate-50 opacity-60'}`}>
                                        <div className="flex items-center justify-between mb-3">
                                            <div>
                                                <div className="font-bold text-slate-800 text-sm">Live AI Mode</div>
                                                <div className="text-xs text-slate-500 mt-0.5">Connect to real Gemini API</div>
                                            </div>
                                            <button onClick={() => setIsLiveMode(true)} className={`w-12 h-6 rounded-full transition-colors relative ${isLiveMode ? 'bg-violet-600' : 'bg-slate-200'}`}>
                                                <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-all ${isLiveMode ? 'left-7' : 'left-1'}`}></div>
                                            </button>
                                        </div>
                                        {isLiveMode && (
                                            <div className="mt-4 animate-fade-in-up">
                                                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Gemini API Key</label>
                                                <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="Paste your API key here..." className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500" />
                                                <p className="text-[10px] text-slate-500 mt-2">Key is stored securely in your browser's local storage and never sent to our servers.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div className="p-5 border-t border-slate-100 bg-slate-50 flex justify-end">
                                    <button onClick={() => setIsSettingsOpen(false)} className="bg-slate-900 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition-colors">Save & Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sidebar Navigation */}
                    <div className="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-50">
                        <div className="p-6 pb-2">
                            <div className="flex items-center space-x-3 mb-8">
                                <div className="w-8 h-8 rounded-lg ai-gradient-bg flex items-center justify-center shadow-lg">
                                    <Icons.Brain className="text-white w-5 h-5" />
                                </div>
                                <div className="flex flex-col">
                                    <span className="text-lg font-bold text-white tracking-tight flex items-center">
                                        HPCA Hub <span className="ml-2 text-[10px] bg-violet-600/80 text-violet-100 px-2 py-0.5 rounded-full border border-violet-500/30">V3</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
                            {steps.map((step) => (
                                <button
                                    key={step.id}
                                    onClick={() => setCurrentStep(step.id)}
                                    className={`w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 ${currentStep === step.id ? 'bg-violet-600 text-white shadow-md shadow-violet-900/20' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <step.icon className={`mr-3 w-5 h-5 ${currentStep === step.id ? 'text-violet-200' : 'text-slate-500'}`} />
                                    {step.name}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Main Workspace */}
                    <div className="flex-1 flex flex-col h-screen overflow-y-auto bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjAzLCAyMTMsIDIyNSwgMC40KSIvPjwvc3ZnPg==')]">
                        <header className="glass-panel sticky top-0 z-40 px-8 py-4 flex justify-between items-center border-b border-slate-200">
                            <div>
                                <h1 className="text-xl font-bold text-slate-800">{steps.find(s => s.id === currentStep)?.name}</h1>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button onClick={() => setIsSettingsOpen(true)} className={`flex items-center text-xs font-semibold px-3 py-1.5 rounded-lg border shadow-sm transition-all ${isLiveMode ? 'bg-violet-50 border-violet-200 text-violet-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                                    <Icons.Key className="w-4 h-4 mr-1.5" /> {isLiveMode ? 'Live AI Mode' : 'Simulation Mode'}
                                </button>
                                <div className="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider hidden sm:inline">My Experience:</span>
                                    <select value={experienceLevel} onChange={(e) => setExperienceLevel(e.target.value)} className="text-sm font-medium text-violet-700 bg-transparent outline-none cursor-pointer">
                                        <option value="novice">Beginner / Accidental CM</option>
                                        <option value="intermediate">Intermediate / Project Manager</option>
                                        <option value="expert">Expert / Change Professional</option>
                                    </select>
                                </div>
                            </div>
                        </header>
                        <main className="p-4 md:p-8 flex-1 relative">
                            {currentStep === 1 && <Dashboard onStart={() => setCurrentStep(2)} experienceLevel={experienceLevel} />}
                            {currentStep === 2 && <Phase1PreDiscovery onComplete={() => setCurrentStep(3)} experienceLevel={experienceLevel} />}
                            {currentStep === 3 && <AppSuite experienceLevel={experienceLevel} />}
                            {currentStep === 4 && <Phase4Deployment />}
                            {currentStep === 5 && <Phase5PostDeployment />}
                            {currentStep === 6 && <LearningPortfolio />}
                            {currentStep === 7 && <TrainingSimulator />}
                            {currentStep === 8 && <EnterpriseAnalytics />}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
